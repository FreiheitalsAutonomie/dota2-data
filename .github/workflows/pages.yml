name: Sync and publish scrim mirror
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore the read-only frontend bundle
        run: |
          cat site/assets/index-CTqgpeZX.js.part*.b64 | base64 --decode | gzip --decompress > site/assets/index-CTqgpeZX.js
          cat site/assets/index-BVcMktdt.css.part*.b64 | base64 --decode | gzip --decompress > site/assets/index-BVcMktdt.css
          rm site/assets/*.part*.b64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate one complete public snapshot
        run: node scripts/sync-mirror.mjs site/data
      - name: Bundle hero portraits for same-origin viewing
        run: node scripts/sync-mirror-assets.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish only after successful synchronization
        id: deployment
        uses: actions/deploy-pages@v4
